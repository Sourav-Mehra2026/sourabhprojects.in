<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1C2541">
<title>Sourabh Projects</title>
<link rel="icon" id="fav">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js" defer></script>
<style>
:root{--bg:#0B132B;--nav:#1C2541;--card:#3A506B;--btn:#5BC0DE;--hov:#D97706;--tx:#F4D6B0;--tx2:#C0CBD8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
nav{position:sticky;top:0;z-index:5;background:var(--nav);border-bottom:1px solid var(--card);display:flex;align-items:center;gap:12px;padding:10px 16px}
nav img{width:38px;height:38px;border-radius:8px}
nav b{font-size:1.1rem;font-weight:800;letter-spacing:.02em;white-space:nowrap}
nav input{flex:1;min-width:0;max-width:340px;margin-left:auto}
input,textarea,select{background:var(--bg);color:var(--tx);border:1px solid var(--card);border-radius:8px;padding:10px;font:inherit;width:100%}
input[type=checkbox]{width:auto}input[type=range]{padding:0}input[type=file]{padding:8px}
button,.btn{background:var(--btn);color:var(--bg);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;display:inline-block;transition:background .15s,transform .1s}
button:hover,.btn:hover{background:var(--hov)}
button:active,.btn:active{transform:scale(.96)}
:focus-visible{outline:2px solid var(--hov);outline-offset:2px}
.wrap{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 61px)}
aside{background:var(--nav);border-right:1px solid var(--card);padding:16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:61px;height:calc(100vh - 61px)}
aside button{background:transparent;color:var(--tx2);text-align:left;display:flex;justify-content:space-between;gap:10px}
aside button:hover,aside button.on{background:var(--card);color:var(--tx)}
main{padding:24px;max-width:1100px}
.hero{display:flex;gap:22px;align-items:center;margin-bottom:28px;flex-wrap:wrap}
.hero img{width:96px;height:96px;border-radius:22px;box-shadow:0 0 0 4px var(--card),0 0 40px rgba(91,192,222,.35);animation:pop .7s ease-out}
@keyframes pop{from{transform:scale(.6) rotate(-12deg);opacity:0}}
.hero h1{margin:0 0 8px;font-size:clamp(1.7rem,5vw,2.8rem);line-height:1.1;font-weight:800;letter-spacing:-.02em}
.hero p{margin:0;color:var(--tx2);max-width:46ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--card);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s;cursor:pointer}
.card:hover{border-color:var(--btn);transform:translateY(-3px)}
.card h3{margin:0;font-size:1.05rem}
.card p{margin:0 0 10px;color:var(--tx2);font-size:.92rem;flex:1}
.ic{font-size:2rem}
.card button{align-self:flex-start}
.soon{opacity:.75}
.soon button{background:transparent;color:var(--tx2);border:1px dashed var(--tx2)}
footer{margin-top:36px;color:var(--tx2);font-size:.9rem;border-top:1px solid var(--card);padding-top:14px}
.modal{position:fixed;inset:0;background:rgba(11,19,43,.85);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.box{background:var(--nav);border:1px solid var(--card);border-radius:16px 16px 0 0;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:18px}
.box header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.box h3{margin:0}
#mb{display:flex;flex-direction:column;gap:12px}
#mb h4{margin:4px 0 0}
.r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.r select{flex:1;min-width:90px}
.big{font-size:1.15rem;word-break:break-all;margin:0}
.mono{font-family:ui-monospace,Menlo,monospace}
.mut,small{color:var(--tx2)}
.pv,video{max-width:100%;border-radius:10px;border:1px solid var(--card)}
.pv{background:#fff}
.note{background:var(--bg);border:1px solid var(--card);border-radius:10px;padding:10px}
.note p{margin:4px 0 8px;color:var(--tx2)}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;transition:width .2s}
.kp{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.kp button{padding:12px 0;background:var(--card);color:var(--tx)}
.kp button:hover{background:var(--hov);color:var(--bg)}
.kp .eq{background:var(--btn);color:var(--bg)}
.mic{font-size:2.2rem;border-radius:50%;width:84px;height:84px;align-self:center}
#tp span.ok{color:#86efac}
#tp span.bad{color:#fca5a5;background:rgba(185,28,28,.3)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--nav);border:1px solid var(--btn);padding:10px 16px;border-radius:10px;z-index:20}
@media(min-width:700px){.modal{align-items:center}.box{border-radius:16px}}
@media(max-width:820px){.wrap{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--card)}aside button{white-space:nowrap}main{padding:16px}nav b{font-size:1rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2000)};
const dl=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()};
const loadImg=f=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=URL.createObjectURL(f)});
function sketch(img,mw=800){const s=Math.min(1,mw/Math.max(img.width,img.height)),w=img.width*s|0,h=img.height*s|0;const a=document.createElement('canvas');a.width=w;a.height=h;const x=a.getContext('2d');x.filter='grayscale(1)';x.drawImage(img,0,0,w,h);const b=document.createElement('canvas');b.width=w;b.height=h;const y=b.getContext('2d');y.filter='grayscale(1) invert(1) blur(5px)';y.drawImage(img,0,0,w,h);x.filter='none';x.globalCompositeOperation='color-dodge';x.drawImage(b,0,0);return a}

let on=true,ac;
const beep=(f=660,d=.08,t='sine')=>{if(!on)return;try{ac=ac||new(window.AudioContext||webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(.15,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}};

pass:el=>{el.innerHTML=`<div id="pv" class="big mono">-</div><label>Length: <b id="lv">16</b></label><input type="range" id="ln" min="6" max="64" value="16"><div class="r"><label><input type="checkbox" id="u" checked> A-Z</label><label><input type="checkbox" id="l" checked> a-z</label><label><input type="checkbox" id="n" checked> 0-9</label><label><input type="checkbox" id="s" checked> @#$</label></div><div class="r"><button id="g">Generate</button><button id="cp">Copy</button></div>`;
const gen=()=>{let set='';if($('#u').checked)set+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';if($('#l').checked)set+='abcdefghijklmnopqrstuvwxyz';if($('#n').checked)set+='0123456789';if($('#s').checked)set+='!@#$%^&*()-_=+?';if(!set)return $('#pv').textContent='Kuch to chuno';const n=+$('#ln').value,a=new Uint32Array(n);crypto.getRandomValues(a);$('#pv').textContent=[...a].map(x=>set[x%set.length]).join('')};
$('#ln').oninput=()=>{$('#lv').textContent=$('#ln').value;gen()};$('#g').onclick=gen;$('#cp').onclick=()=>navigator.clipboard.writeText($('#pv').textContent).then(()=>toast('Copy ho gaya'));gen()},

qr:el=>{el.innerHTML=`<video id="v" playsinline hidden></video><div class="r"><button id="cam">Camera se scan</button><label class="btn">Image se scan<input type="file" id="f" accept="image/*" hidden></label></div><pre id="o" class="note" style="white-space:pre-wrap;word-break:break-all">Result yahan dikhega</pre>`;
if(!('BarcodeDetector' in window)){$('#o').textContent='Is browser me QR support nahi hai. Android Chrome use karo.';return}
const d=new BarcodeDetector({formats:['qr_code']});let st,run=0;const stop=()=>{run=0;st&&st.getTracks().forEach(t=>t.stop())};cleanup=stop;
$('#f').onchange=async e=>{const r=await d.detect(await createImageBitmap(e.target.files[0]));$('#o').textContent=r.length?r[0].rawValue:'QR nahi mila'};

calc:el=>{const K='C ( ) ⌫ % / 7 8 9 sin( cos( * 4 5 6 tan( log( - 1 2 3 ln( sqrt( + 0 . ^ pi e ='.split(' ');el.innerHTML=`<input id="ds" class="big mono" placeholder="0"><div class="kp">${K.map(k=>`<button class="${k=='='?'eq':''}">${k}</button>`).join('')}</div><small>Angles degree me hain.</small>`;const ds=$('#ds');
const ev=()=>{try{const s=ds.value.replace(/\^/g,'**');if(!/^[0-9+\-*/().%\sa-z]*$/.test(s)||(s.match(/[a-z]+/g)||[]).some(w=>!['sin','cos','tan','log','ln','sqrt','pi','e'].includes(w)))throw 0;const r=Function('const sin=x=>Math.sin(x*Math.PI/180),cos=x=>Math.cos(x*Math.PI/180),tan=x=>Math.tan(x*Math.PI/180),log=Math.log10,ln=Math.log,sqrt=Math.sqrt,pi=Math.PI,e=Math.E;return('+s+')')();ds.value=+r.toFixed(10)}catch(x){ds.value='Error'}};
$('.kp').onclick=e=>{if(e.target.tagName!='BUTTON')return;const k=e.target.textContent;if(ds.value=='Error')ds.value='';if(k=='C')ds.value='';else if(k=='⌫')ds.value=ds.value.slice(0,-1);else if(k=='=')ev();else ds.value+=k};ds.onkeydown=e=>{if(e.key=='Enter')ev()}},

viz:el=>{el.innerHTML=`<textarea id="dt" rows="5">Jan,40
Feb,65
Mar,30
Apr,80
May,55</textarea><small>Har line me: naam,number</small><div class="r"><select id="ty"><option value="bar">Bar chart</option><option value="line">Line chart</option></select><button id="go">Chart banao</button><button id="sv">PNG save</button></div><canvas id="cv" width="600" height="300" class="pv"></canvas>`;
const draw=()=>{const rows=$('#dt').value.trim().split('\n').map(l=>l.split(',')).filter(r=>r.length>1&&!isNaN(+r[1])),x=$('#cv').getContext('2d'),W=600,H=300;x.fillStyle='#0B132B';x.fillRect(0,0,W,H);if(!rows.length)return;const m=Math.max(...rows.map(r=>+r[1]))||1,bw=(W-60)/rows.length,ty=$('#ty').value;x.font='13px sans-serif';x.textAlign='center';
if(ty=='line'){x.strokeStyle='#5BC0DE';x.lineWidth=3;x.beginPath();rows.forEach((r,i)=>{const px=40+bw*i+bw/2,py=H-40-(H-80)*r[1]/m;i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}
rows.forEach((r,i)=>{const px=40+bw*i+bw/2,h=(H-80)*r[1]/m;if(ty=='bar'){x.fillStyle='#5BC0DE';x.fillRect(px-bw*.35,H-40-h,bw*.7,h)}else{x.fillStyle='#D97706';x.beginPath();x.arc(px,H-40-h,5,0,7);x.fill()}x.fillStyle='#F4D6B0';x.fillText(r[0].trim(),px,H-18);x.fillText(r[1].trim(),px,H-48-h)})};
$('#go').onclick=draw;$('#sv').onclick=()=>$('#cv').toBlob(b=>dl(b,'chart.png'));draw()},

let F='Sab',Q='';

function side(){$('#side').innerHTML=FL.map(([k,n])=>`<button data-f="${k}" class="${k==F?'on':''}"><span>${n}</span><span>${k=='Sab'?P.length:k=='Soon'?P.filter(p=>!p.run).length:P.filter(p=>p.c==k).length}</span></button>`).join('')}
function render(){const L=P.filter(p=>(F=='Sab'||(F=='Soon'?!p.run:p.c==F))&&(p.t+p.d).toLowerCase().includes(Q));

$('#q').oninput=e=>{Q=e.target.value.toLowerCase();render()};
$('#grid').onclick=e=>{const c=e.target.closest('.card');if(c)openP(P.find(p=>p.id==c.dataset.id))};

function openP(p){cleanup&&cleanup();cleanup=null;if(!p.run){toast(p.t+': jaldi aa raha hai');beep(300,.18,'triangle');return}
$('#mt').textContent=p.ic+' '+p.t;$('#mb').innerHTML='';$('#md').hidden=false;document.body.style.overflow='hidden';p.run($('#mb'));beep(520,.08);setTimeout(()=>beep(780,.1),90)}
function shut(){cleanup&&cleanup();cleanup=null;$('#md').hidden=true;document.body.style.overflow='';speechSynthesis.cancel();beep(400,.1)}
$('#x').onclick=shut;$('#md').onclick=e=>{if(e.target.id=='md')shut()};addEventListener('keydown',e=>{if(e.key=='Escape'&&!$('#md').hidden)shut()});
